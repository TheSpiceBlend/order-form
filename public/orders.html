<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders – The SpiceBlend</title>
      <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsudGhlc3BpY2VibGVuZC5jb20k"
    src="https://clerk.thespiceblend.com/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript">
  </script>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fdf8f2; color: #333; min-height: 100vh; }
    header { background: #5c2d0e; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.4rem; letter-spacing: 1px; }
    .nav-links a { color: #ffd98a; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
    main { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    h2 { font-size: 1.5rem; color: #5c2d0e; margin-bottom: 24px; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .order-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; padding: 20px 24px; }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .order-title { font-weight: 700; font-size: 1.05rem; color: #5c2d0e; }
    .order-date { font-size: 0.85rem; color: #999; }
    .order-items { font-size: 0.95rem; line-height: 1.6; color: #444; margin-bottom: 10px; }
    .order-total { font-weight: 700; color: #2d6e2d; font-size: 1rem; }
    .order-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: #e8f5e9; color: #2d6e2d; }
    .payment-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .payment-badge.paid { background: #e8f5e9; color: #2d6e2d; }
    .payment-badge.pending { background: #fff3e0; color: #e65100; }
    .no-orders { text-align: center; padding: 60px 20px; color: #888; }
    .no-orders a { color: #5c2d0e; text-decoration: underline; }
    #clerk-sign-in { max-width: 400px; margin: 60px auto; }
    .sign-out-btn { background: none; border: 1px solid #ffd98a; color: #ffd98a; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .sign-out-btn:hover { background: rgba(255,217,138,0.15); }
  </style>
</head>
<body>
  <header>
    <h1>🌶 The SpiceBlend</h1>
    <div class="nav-links">
      <a href="/">Home</a>
      <button class="sign-out-btn" id="sign-out-btn" style="display:none">Sign Out</button>
    </div>
  </header>
  <main>
    <div id="clerk-sign-in"></div>
    <div id="orders-section" style="display:none">
      <h2>My Orders</h2>
      <div id="orders-container"><div class="loading">Loading your orders…</div></div>
    </div>
  </main>
  <script>
    const PUBLISHABLE_KEY = 'pk_live_Y2xlcmsuZGhlbGMzBpY2VibGVuZC5jb20k';

    async function loadOrders() {
      document.getElementById('clerk-sign-in').style.display = 'none';
      document.getElementById('orders-section').style.display = 'block';
      const signOutBtn = document.getElementById('sign-out-btn');
      signOutBtn.style.display = 'inline-block';
      signOutBtn.addEventListener('click', () => {
        window.Clerk.signOut().then(() => window.location.href = '/login.html');
      });
      try {
        const token = await window.Clerk.session.getToken();
        const res = await fetch('/api/my-orders', {
          headers: { Authorization: 'Bearer ' + token }
        });
        const data = await res.json();
        const container = document.getElementById('orders-container');
        if (!data.orders || data.orders.length === 0) {
          container.innerHTML = '<div class="no-orders"><p>No orders found.</p><p style="margin-top:12px"><a href="/">Place your first order</a></p></div>';
          return;
        }
        container.innerHTML = data.orders.map(order => {
          const date = order['timestamp'] || order['date'] || order['order date'] || '';
          const items = order['items'] || order['order'] || order['products'] || '';
          const total = order['total'] || order['amount'] || order['price'] || '';
          const status = order['status'] || 'Received';
          const id = order['order id'] || order['orderid'] || order['id'] || '';
          const paymentStatus = (order['payment status'] || order['payment'] || order['paid'] || '').toLowerCase().trim();
          return `<div class="order-card">
            <div class="order-header">
              <div class="order-title">${id ? 'Order #' + id : 'Order'}</div>
              <div class="order-date">${date}</div>
            </div>
            <div class="order-items">${items}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
              ${total ? '<div class="order-total">Total: ¥' + total + '</div>' : ''}
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                <span class="order-status">${status}</span>
                <span class="payment-badge ${paymentStatus === 'paid' ? 'paid' : 'pending'}">${paymentStatus === 'paid' ? '✅ Paid' : '⏳ Payment Pending'}</span>
              </div>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        document.getElementById('orders-container').innerHTML = '<div class="loading">Error loading orders. Please try again.</div>';
        console.error(err);
      }
    }

    // Same robust waitForClerk pattern as login.html
    let _clerkLoadPromise = null;
    function waitForClerk() {
      if (_clerkLoadPromise) return _clerkLoadPromise;
      _clerkLoadPromise = new Promise((resolve, reject) => {
        let elapsed = 0;
        const interval = setInterval(async () => {
          elapsed += 50;
          if (window.Clerk) {
            clearInterval(interval);
            try { await window.Clerk.load(); resolve(window.Clerk); }
            catch(e) { reject(e); }
          } else if (elapsed > 10000) {
            clearInterval(interval);
            reject(new Error('Clerk failed to load'));
          }
        }, 50);
      });
      return _clerkLoadPromise;
    }

    waitForClerk().then(clerk => {
      if (!clerk.user) {
        clerk.mountSignIn(document.getElementById('clerk-sign-in'));
        clerk.addListener(({ user }) => { if (user) loadOrders(); });
      } else {
        loadOrders();
      }
    }).catch(err => {
      document.getElementById('orders-container').innerHTML =
        '<div class="loading">Auth service failed to load. Please refresh.</div>';
      console.error(err);
    });
  </script>
</body>
</html>
